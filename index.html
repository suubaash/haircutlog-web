<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HaircutLog</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- Auth screen -->
  <section id="screen-auth" class="screen active">
    <div class="auth-card">
      <div class="auth-logo">✂️</div>
      <h1>HaircutLog</h1>
      <p class="auth-subtitle">Track every haircut, privately.</p>
      <div class="form-group">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="error-text" id="auth-error"></div>
      <button class="primary" id="btn-sign-in">Sign In</button>
      <button class="secondary" id="btn-sign-up">Create Account</button>
      <div class="auth-divider"><span>or</span></div>
      <button class="social-button google" id="btn-google-signin">
        <span class="social-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="18" height="18">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        <span>Sign in with Google</span>
      </button>
      <button class="social-button apple" id="btn-apple-signin">
        <span class="social-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M17.05 12.04c-.03-2.87 2.34-4.25 2.45-4.32-1.34-1.96-3.42-2.23-4.16-2.26-1.77-.18-3.45 1.04-4.35 1.04-.89 0-2.27-1.02-3.74-.99-1.92.03-3.7 1.12-4.69 2.84-2 3.47-.51 8.6 1.44 11.42.95 1.38 2.09 2.93 3.58 2.87 1.44-.06 1.98-.93 3.72-.93 1.73 0 2.22.93 3.74.9 1.54-.03 2.52-1.4 3.46-2.79 1.09-1.6 1.54-3.15 1.57-3.23-.03-.02-3.01-1.16-3.04-4.59zM14.53 3.9c.79-.96 1.32-2.29 1.18-3.62-1.14.05-2.52.76-3.34 1.72-.73.85-1.37 2.21-1.2 3.51 1.27.1 2.57-.65 3.36-1.61z"/>
          </svg>
        </span>
        <span>Sign in with Apple</span>
      </button>
    </div>
  </section>

  <!-- Haircuts list screen -->
  <section id="screen-haircuts" class="screen">
    <div class="top-bar">
      <button class="icon-button secondary-icon" id="btn-account">⚙︎</button>
      <h1>Haircuts</h1>
      <button class="icon-button" id="btn-add-entry">＋</button>
    </div>
    <div id="next-haircut-banner" class="next-haircut-banner"></div>
    <div id="haircuts-content"></div>
  </section>

  <!-- Nearby salons screen -->
  <section id="screen-salons" class="screen">
    <div class="top-bar">
      <h1>Nearby Salons</h1>
    </div>
    <div id="salons-content"></div>
  </section>

  <!-- Tab bar -->
  <nav class="tab-bar" id="tab-bar" style="display:none;">
    <button class="tab-button active" data-screen="haircuts">
      <span class="tab-icon">✂️</span>
      <span>Haircuts</span>
    </button>
    <button class="tab-button" data-screen="salons">
      <span class="tab-icon">📍</span>
      <span>Nearby Salons</span>
    </button>
  </nav>

  <!-- Add entry modal -->
  <div class="modal-overlay" id="modal-add">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="link-button" id="btn-cancel-add">Cancel</button>
        <h2>New Haircut</h2>
        <button class="link-button primary-action" id="btn-save-add">Save</button>
      </div>
      <div class="form-group">
        <label for="add-date">Date</label>
        <input type="date" id="add-date">
      </div>
      <img id="add-photo-preview" class="photo-picker-preview" style="display:none;">
      <label class="photo-picker-label" id="add-photo-label">
        <span class="photo-picker-icon">📷</span>
        <span>Add a Photo</span>
        <input type="file" accept="image/*" capture="environment" id="add-photo-input" style="display:none;">
      </label>
      <div class="error-text" id="add-error"></div>
    </div>
  </div>

  <!-- Account modal -->
  <div class="modal-overlay" id="modal-account">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="link-button" id="btn-close-account">Close</button>
        <h2>Account</h2>
        <span></span>
      </div>
      <div class="account-email" id="account-email"></div>
      <div class="form-group">
        <label for="frequency-input">Haircut Frequency (weeks)</label>
        <input type="number" id="frequency-input" min="1" max="26" step="1">
      </div>
      <button class="secondary" id="btn-sign-out">Sign Out</button>
      <button class="link-button destructive-action full-width" id="btn-delete-account">Delete Account</button>
      <div class="error-text" id="account-error"></div>
    </div>
  </div>

  <!-- Delete account confirm modal -->
  <div class="modal-overlay" id="modal-delete-confirm">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="confirm-title">Delete Your Account?</h2>
      <p class="confirm-body">This permanently deletes your account and all haircut entries. This can't be undone.</p>
      <button class="primary destructive-button" id="btn-confirm-delete">Delete Account</button>
      <button class="secondary" id="btn-cancel-delete">Cancel</button>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="modal-detail">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="link-button" id="btn-close-detail">Close</button>
        <h2>Haircut</h2>
        <button class="link-button destructive-action" id="btn-delete-detail">Delete</button>
      </div>
      <img id="detail-photo" class="detail-photo">
      <div id="detail-date" class="detail-date-text"></div>
    </div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
